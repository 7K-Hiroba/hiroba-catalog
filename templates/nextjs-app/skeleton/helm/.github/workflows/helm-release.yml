name: Release Helm

# release-please creates the GitHub release; publishing it triggers chart release.
on:
  release:
    types: [published]

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # Tags are plain vX.Y.Z (include-component-in-tag: false); strip the v.
      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  publish:
    needs: version
    uses: 7K-Group/workflows-library/.github/workflows/release-helm.yml@v1
    with:
      path: helm
      version: ${{ needs.version.outputs.version }}
    secrets: inherit
