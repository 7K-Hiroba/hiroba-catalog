suite: deployment
templates:
  - deployment.yaml
tests:
  - it: renders a Deployment with the app container
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.template.spec.containers[0].ports[0].name
          value: http
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 3000

  - it: uses the chart appVersion as default image tag
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: sample-app:0.1.0

  - it: honors image tag override
    set:
      image.tag: 1.2.3
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: sample-app:1.2.3

  - it: omits replicas when autoscaling is enabled
    set:
      autoscaling.enabled: true
    asserts:
      - notExists:
          path: spec.replicas
